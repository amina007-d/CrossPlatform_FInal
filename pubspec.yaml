name: finaldemo
description: "Personal Finance Tracker - Flutter Final Project"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.0.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  chopper: ^8.0.0

  # JSON Serialization
  json_annotation: ^4.9.0

  # Local DB
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Preferences
  shared_preferences: ^2.3.0

  # Firebase
  firebase_core: ^3.1.0
  cloud_firestore: ^5.1.0

  # UI
  fl_chart: ^0.68.0
  intl: ^0.19.0
  flutter_slidable: ^3.1.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0
  chopper_generator: ^8.0.0

flutter:
  uses-material-design: true